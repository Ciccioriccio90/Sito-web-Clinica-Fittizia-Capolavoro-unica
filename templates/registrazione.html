{% extends "base.html" %}

{% block main %}
<section class="intro hero">
    <h2>Registrazione Nuovo Utente</h2>
    <p>Crea il tuo account per accedere ai servizi della Clinica Giorgi</p>
</section>

<div class="form-container">
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="alert alert-warning" style="background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ffeeba;">
                {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form action="{{ url_for('registrazione') }}" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label for="ruolo">Registrati come:</label>
            <select name="ruolo" id="ruolo" onchange="toggleFields()" required>
                <option value="paziente">Paziente</option>
                <option value="dottore">Dottore</option>
            </select>
        </div>

        <hr>

        <div class="form-group">
            <label>Nome:</label>
            <input type="text" name="nome" required>
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-group">
            <label>Conferma Password:</label>
            <input type="password" name="confirm_password" required>
        </div>

        <div id="fields-paziente">
            <div class="form-group">
                <label>Codice Fiscale:</label>
                <input type="text" name="cf" maxlength="16">
            </div>
            <div class="form-group">
                <label>Cognome:</label>
                <input type="text" name="cognome">
            </div>
            <div class="form-group">
                <label>Data di Nascita:</label>
                <input type="date" name="nascita">
            </div>
        </div>

        <div id="fields-dottore" style="display: none;">
            <div class="form-group">
                <label>Codice Dottore (es. DOC003):</label>
                <input type="text" name="codice">
            </div>
            <div class="form-group">
                <label>Specializzazione:</label>
                <input type="text" name="specializzazione">
            </div>
            <div class="form-group">
                <label>Foto Profilo:</label>
                <input type="file" name="foto" accept="image/*">
            </div>
        </div>

        <button type="submit" class="btn">Registrati</button>
    </form>
</div>

<script>
function toggleFields() {
    const ruolo = document.getElementById('ruolo').value;
    const fieldsPaziente = document.getElementById('fields-paziente');
    const fieldsDottore = document.getElementById('fields-dottore');

    if (ruolo === 'dottore') {
        fieldsDottore.style.display = 'block';
        fieldsPaziente.style.display = 'none';
    } else {
        fieldsDottore.style.display = 'none';
        fieldsPaziente.style.display = 'block';
    }
}
</script>
{% endblock %}
